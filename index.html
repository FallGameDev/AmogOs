<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="amogos-launcher" content="1">
<title>AmogOs</title>
<style>
/* AmogOs launcher: a tiny page that sets up your PC, then runs the real OS from the browser cache. */
html,body{margin:0;height:100%;background:#0a1330;overflow:hidden}
/* The OS runs inside this full-screen frame */
#h{position:fixed;left:0;top:0;width:100%;height:100%;border:0;background:#000}
/* The "setting up" screen that sits on top until the OS is ready */
#u{position:fixed;left:0;top:0;width:100%;height:100%;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
 background:linear-gradient(135deg,#0a1330,#1a1148 60%,#2a0b3f);color:#fff;font:16px "Segoe UI",system-ui,sans-serif;text-align:center;padding:20px;box-sizing:border-box;transition:opacity .5s}
#u svg{width:96px;height:96px}
#t{font-size:26px;font-weight:600}
#s{opacity:.8;max-width:520px;min-height:22px}
#bw{width:280px;height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
#b{height:100%;width:0;background:#4cc2ff;transition:width .3s}
#e{opacity:.65;font-size:14px;min-height:18px}
#x{display:none;max-width:560px;max-height:26vh;overflow:auto;text-align:left;background:rgba(0,0,0,.35);padding:10px;border-radius:8px;font:13px Consolas,monospace;white-space:pre-wrap}
button{padding:9px 18px;border-radius:8px;border:0;background:#4cc2ff;color:#001a26;font:600 15px "Segoe UI",system-ui,sans-serif;cursor:pointer;display:none}
</style>
</head>
<body>
<div id="u">
  <!-- the AmogOs planet -->
  <svg viewBox="0 0 96 96" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
   <clipPath id="f"><rect x="0" y="48" width="96" height="48"/></clipPath></defs>
   <g transform="rotate(-18 48 48)"><ellipse cx="48" cy="48" rx="42" ry="14" fill="none" stroke="#f0abfc" stroke-width="4.5"/></g>
   <circle cx="48" cy="48" r="24" fill="url(#g)"/>
   <g transform="rotate(-18 48 48)"><ellipse cx="48" cy="48" rx="42" ry="14" fill="none" stroke="#f0abfc" stroke-width="4.5" clip-path="url(#f)"/></g></svg>
  <div id="t">Setting up your PC</div>
  <div id="s">Please wait…</div>
  <div id="bw"><div id="b"></div></div>
  <div id="e"></div>
  <pre id="x"></pre>
  <button id="r">Try again</button>
</div>
<script>
"use strict";
/* ============================================================
   How this works
   1. The real OS (AmogOs-Core.html) is NOT inside this file. It lives in the browser cache.
   2. First start: download the newest OS from the GitHub release, save it in the cache, run it.
   3. Every start after that: run the saved copy straight away (no download).
   4. Updates: inside the OS, Settings > Update saves a newer copy to the same place. Next start runs it.
   5. If a new version does not start in time, we go back to the last version that worked.
   User data (accounts, files) lives in this page's browser storage, not in the OS file, so swapping
   the OS never touches it.
   ============================================================ */
(function(){
 var REPO='FallGameDev/OS.Lite';
 var EDGE='https://mcqpodbwtwhjhkycwhzf.supabase.co/functions/v1/fetch-page';           // backup way to reach GitHub downloads
 var RAW='https://raw.githubusercontent.com/'+REPO+'/main/AmogOs-Core.html';             // last-resort copy of the OS
 var MAX=15,EST=8; // give up on a new version after MAX seconds; EST = guessed start time for the progress bar
 var CK='amogos-update',CU='https://amogos.invalid/patch',CG='https://amogos.invalid/good'; // cache name + keys (same as the OS uses)
 var L;try{L=localStorage}catch(e){L={getItem:function(){return null},setItem:function(){},removeItem:function(){}}}
 function $(id){return document.getElementById(id)}
 function secs(n){return n<=1?'less than a second':'about '+Math.ceil(n)+' seconds'}

 /* ---------- the setup screen ---------- */
 function ui(title,sub,f,eta){
  $('t').textContent=title;$('s').textContent=sub||'';
  $('b').style.width=(f==null?0:Math.round(f*100))+'%';
  $('e').textContent=eta==null?'':secs(eta)+' left';
 }

 /* ---------- saving the OS: browser cache first, IndexedDB as the backup ----------
    The OS file can be huge, so it never goes in localStorage (5 MB limit).
    localStorage only keeps small notes: patchStore (where), releaseTag (version), releaseUrl, goodTag, boot. */
 function idb(){return new Promise(function(ok,no){var r=indexedDB.open('amogos-update',1);r.onupgradeneeded=function(){r.result.createObjectStore('p')};r.onsuccess=function(){ok(r.result)};r.onerror=function(){no(r.error)}})}
 function readStore(which){ // which = 'code' (the version to run) or 'good' (last version that started fine)
  return Promise.resolve().then(function(){
   var kind=L.getItem('amogos.patchStore');
   if(kind==='cache')return caches.open(CK).then(function(c){return c.match(which==='good'?CG:CU)}).then(function(r){return r?r.text():null});
   if(kind==='idb')return idb().then(function(db){return new Promise(function(ok,no){var q=db.transaction('p').objectStore('p').get(which);q.onsuccess=function(){var v=q.result||null;db.close();ok(v)};q.onerror=function(){db.close();no(q.error)}})});
   return null;
  });
 }
 function writeStore(which,text){
  var kind=L.getItem('amogos.patchStore');
  function toCache(){return caches.open(CK).then(function(c){return c.put(which==='good'?CG:CU,new Response(text,{headers:{'Content-Type':'text/html'}}))}).then(function(){L.setItem('amogos.patchStore','cache')})}
  function toIdb(){return idb().then(function(db){return new Promise(function(ok,no){var t=db.transaction('p','readwrite');t.objectStore('p').put(text,which);t.oncomplete=function(){db.close();ok()};t.onerror=function(){db.close();no(t.error)}})}).then(function(){L.setItem('amogos.patchStore','idb')})}
  if(kind==='idb')return toIdb();
  if(kind==='cache')return toCache();
  return Promise.resolve().then(toCache).catch(toIdb); // first save: try the cache, else IndexedDB
 }
 function wipe(){
  ['amogos.releaseUrl','amogos.releaseTag','amogos.patchStore','amogos.patchCode','amogos.goodTag','amogos.badTag','amogos.boot'].forEach(function(k){L.removeItem(k)});
  try{caches.delete(CK)}catch(e){}try{indexedDB.deleteDatabase('amogos-update')}catch(e){}
 }

 /* ---------- downloading the newest OS ---------- */
 function readBody(r,total,prog){ // read the download piece by piece so we can show progress
  if(!r.body||!r.body.getReader)return r.text();
  var rd=r.body.getReader(),dec=new TextDecoder(),got=0,out='';
  total=total||+r.headers.get('content-length')||0;
  return (function pump(){return rd.read().then(function(x){
   if(x.done)return out+dec.decode();
   got+=x.value.length;out+=dec.decode(x.value,{stream:true});prog(got,total);return pump();
  })})();
 }
 function tryDownload(list,size,prog){ // tries each address in turn until one gives a real OS file
  var i=0;
  function next(){
   if(i>=list.length)return Promise.reject(new Error('download'));
   var o=list[i++];
   return fetch(o.u,{headers:o.h||{}}).then(function(r){if(!r.ok)throw 0;return readBody(r,size,prog)})
    .then(function(t){if(!/<html/i.test(t)||!/amogos/i.test(t)||t.length<20000)throw 0;return t}).catch(next);
  }
  return next();
 }
 function latest(prog){ // find the newest release, then download its OS file
  return fetch('https://api.github.com/repos/'+REPO+'/releases/latest',{headers:{Accept:'application/vnd.github+json'}})
   .then(function(r){if(!r.ok)throw 0;return r.json()})
   .then(function(j){
    var as=j.assets||[],a=as.find(function(x){return /core.*\.html?$/i.test(x.name)});
    if(!a)throw 0;
    return tryDownload([
     {u:a.url,h:{Accept:'application/octet-stream'}},                     // GitHub API (allows browser downloads)
     {u:EDGE+'?url='+encodeURIComponent(a.browser_download_url)},         // through the Supabase page fetcher
     {u:a.browser_download_url}                                           // direct (often blocked by the browser)
    ],a.size,prog).then(function(code){return{code:code,url:a.browser_download_url}});
   })
   .catch(function(){return tryDownload([{u:RAW}],0,prog).then(function(code){return{code:code,url:RAW}})}); // fall back to the copy on main
 }
 function versionOf(code){var m=code.match(/name="amogos-version"\s+content="([^"]+)"/);return m?m[1]:'0'}

 /* ---------- running the OS inside a full-screen frame ---------- */
 var frame=null;
 function run(code,tag){
  L.setItem('amogos.boot','pending'); // the OS flips this to "ok" once it has started
  if(frame)frame.remove();
  frame=document.createElement('iframe');frame.id='h';
  frame.setAttribute('allow','autoplay; fullscreen; gamepad; clipboard-write; pointer-lock; microphone; camera');
  document.body.insertBefore(frame,$('u'));
  frame.srcdoc=code;
  var t0=Date.now();ui('Starting AmogOs '+tag,'',0,EST);
  var iv=setInterval(function(){
   var el=(Date.now()-t0)/1000;
   if(L.getItem('amogos.boot')==='ok'){ // the OS says it started fine
    clearInterval(iv);ui('Ready!','AmogOs '+tag,1,null);
    setTimeout(function(){$('u').style.opacity='0';setTimeout(function(){$('u').style.display='none'},500)},600);
    if(L.getItem('amogos.goodTag')!==tag)writeStore('good',code).then(function(){L.setItem('amogos.goodTag',tag)},function(){}); // remember: this version works
    return;
   }
   if(el>MAX){clearInterval(iv);failed(tag);return}
   ui('Starting AmogOs '+tag,'Almost there…',Math.min(.95,el/EST),Math.max(1,EST-el));
  },200);
 }
 function failed(tag){ // a version did not start: go back to the last one that did
  var good=L.getItem('amogos.goodTag');
  ui('That version did not start','Going back to the last version that worked…',1,null);
  if(good&&good!==tag){
   L.setItem('amogos.badTag',tag);
   readStore('good').then(function(g){
    if(!g)throw 0;
    L.setItem('amogos.releaseTag',good);
    return writeStore('code',g).then(function(){run(g,good)});
   }).catch(function(){gaveUp('No older version was saved.')});
  }else gaveUp('This version could not start.');
 }
 function gaveUp(why){ // nothing left to try: say so, with a button
  ui('AmogOs could not start',why,0,null);
  $('x').style.display='block';$('x').textContent='Version '+(L.getItem('amogos.releaseTag')||'unknown')+'. Pressing Try again downloads a fresh copy. Your accounts and files are kept.';
  var r=$('r');r.style.display='block';r.onclick=function(){wipe();location.reload()};
 }

 /* ---------- first start: download, save, run ---------- */
 function firstRun(){
  var t0=Date.now();
  ui('Setting up your PC','Finding the newest AmogOs…',0,null);
  latest(function(got,total){
   var f=total?Math.min(1,got/total):0,el=(Date.now()-t0)/1000;
   ui('Setting up your PC','Downloading AmogOs…',f*.8,f>.03?(el/f-el)+3:null);
  }).then(function(r){
   var tag=versionOf(r.code);
   ui('Setting up your PC','Saving it on this device…',.85,2);
   return writeStore('code',r.code).catch(function(){}) // if saving fails we still run it, but must download again next time
    .then(function(){L.setItem('amogos.releaseTag',tag);L.setItem('amogos.releaseUrl',r.url);run(r.code,tag)});
  }).catch(function(){
   ui('Could not set up your PC','AmogOs needs the internet the first time it starts. Check your connection and try again.',0,null);
   var b=$('r');b.style.display='block';b.onclick=function(){b.style.display='none';firstRun()};
  });
 }

 /* ---------- start ---------- */
 readStore('code').catch(function(){return null}).then(function(code){
  if(code&&code.length>20000)run(code,L.getItem('amogos.releaseTag')||versionOf(code));
  else firstRun();
 });
})();
</script>
</body>
</html>
